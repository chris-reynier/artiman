name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build (32-bit)
        env:
          GOOS: windows
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go build -o artiman.exe ./cmd/artiman
